name: yume-linux

on:
  push:
    branches: [ develop ]
    paths:
      - '**.cpp'
      - '**.h'
      - 'CMakeLists.txt'
      - '.github/workflows/yume-linux.yml'
      - 'program_info/**'
      - 'launcher/resources/**'
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    env:
      VCPKG_DEFAULT_TRIPLET: x64-linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install base deps
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config qt6-base-dev qt6-tools-dev qt6-tools-dev-tools

      # Bonne action vcpkg
      - name: Restore and run vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: true

      - name: Configure (CMake + Ninja)
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_TOOLCHAIN_FILE="${VCPKG_ROOT}/scripts/buildsystems/vcpkg.cmake"

      - name: Build
        run: cmake --build build --config Release -j 2

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yume-linux
          path: build/**
