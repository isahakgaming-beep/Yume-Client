name: yume-windows

on:
  push:
    branches: [ develop ]
    paths:
      - '**.cpp'
      - '**.h'
      - 'CMakeLists.txt'
      - 'program_info/**'
      - 'launcher/resources/**'
      - '.github/workflows/yume-windows.yml'
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Enable MSVC env
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qt5compat qtnetworkauth'

      - name: Setup vcpkg (zlib)
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgTriplet: x64-windows
          vcpkgJsonGlob: 'vcpkg.json'
          runVcpkgInstall: true

      - name: Configure (CMake + Ninja)
        shell: cmd
        run: >
          cmake -S . -B build -G "Ninja"
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_PREFIX_PATH="%Qt6_DIR%"
          -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake"

      - name: Build
        shell: cmd
        run: cmake --build build --config Release -j 2

      # Préparer un dossier "dist\Yume" avec l'exe + DLL Qt (windeployqt)
      - name: Bundle with windeployqt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exe = Join-Path "build" "prismlauncher.exe"
          if (!(Test-Path $exe)) { $exe = Join-Path "build\launcher" "prismlauncher.exe" }
          if (!(Test-Path $exe)) { throw "Impossible de trouver l'exécutable (prismlauncher.exe)." }

          New-Item -ItemType Directory -Path "dist\Yume" -Force | Out-Null
          Copy-Item $exe "dist\Yume\YumeLauncher.exe" -Force

          $qtBin = Resolve-Path "$env:Qt6_DIR\..\..\bin\windeployqt.exe"
          & $qtBin "dist\Yume\YumeLauncher.exe" --release --compiler-runtime

      # Zipper avec tar (évite le bug 'Compress-Archive: Stream was too long')
      - name: Package zip
        shell: cmd
        run: tar -a -c -f yume-windows.zip -C dist Yume

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yume-windows
          path: yume-windows.zip
