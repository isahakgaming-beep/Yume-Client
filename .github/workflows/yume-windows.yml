name: yume-windows

on:
  push:
    branches: [ develop ]
    paths:
      - '**.cpp'
      - '**.h'
      - 'CMakeLists.txt'
      - 'program_info/**'
      - 'launcher/resources/**'
      - '.github/workflows/yume-windows.yml'
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Enable MSVC env
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qt5compat qtnetworkauth'
          cache: true

      # vcpkg dispo pour CMake (manifeste géré par Prism)
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgTriplet: x64-windows
          runVcpkgInstall: false

      - name: Configure (CMake + Ninja)
        shell: cmd
        run: >
          cmake -S . -B build -G "Ninja"
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DCMAKE_PREFIX_PATH="%Qt6_DIR%"
          -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake"

      # Build uniquement l'appli (nom de target varie selon branches)
      - name: Build (launcher only)
        shell: cmd
        run: cmake --build build --config Release --target PrismLauncher -j 6 || cmake --build build --config Release --target prismlauncher -j 6

      # Déploiement des DLL Qt
      - name: Bundle with windeployqt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            "build\PrismLauncher.exe",
            "build\prismlauncher.exe",
            "build\launcher\PrismLauncher.exe",
            "build\launcher\prismlauncher.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "Impossible de trouver l'exécutable (PrismLauncher/prismlauncher)." }

          New-Item -ItemType Directory -Path "dist\Yume" -Force | Out-Null
          Copy-Item $exe "dist\Yume\YumeLauncher.exe" -Force

          $qtRoot = Split-Path -Parent (Split-Path -Parent $env:Qt6_DIR)
          $guess = Join-Path $qtRoot "bin\windeployqt.exe"
          if (Test-Path $guess) { $qtBin = $guess }
          else {
            $qtBin = (Get-ChildItem -Path $qtRoot -Recurse -Filter windeployqt.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $qtBin) { throw "windeployqt introuvable (Qt6_DIR=$env:Qt6_DIR)" }

          Write-Host "Using windeployqt at: $qtBin"
          & $qtBin "dist\Yume\YumeLauncher.exe" --release --compiler-runtime

      # Copier zlib1.dll si présent (installé par vcpkg côté build)
      - name: Copy vcpkg runtime DLLs (zlib)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $target  = "dist\Yume\"
          New-Item -ItemType Directory -Path $target -Force | Out-Null

          $searchRoots = @("$env:GITHUB_WORKSPACE", "$env:VCPKG_ROOT")
          $found = $null
          foreach ($root in $searchRoots) {
            if (-not (Test-Path $root)) { continue }
            $hit = Get-ChildItem -Path $root -Recurse -Filter "zlib1.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($hit) { $found = $hit.FullName; break }
          }
          if ($found) {
            Copy-Item $found $target -Force
            Write-Host "Copié: $found"
          } else {
            Write-Host "Note: zlib1.dll non trouvé – probablement statiquement lié ou non requis."
          }

      # ⬅️ NOUVEAU : déposer le thème & l'icône Yume à côté de l'exe (fallback disque du main.cpp)
      - name: Copy Yume theme & icon beside EXE
        shell: pwsh
        run: |
          $repo = $env:GITHUB_WORKSPACE
          $dst  = "dist\Yume\yume\icons"
          New-Item -ItemType Directory -Path $dst -Force | Out-Null

          $srcQss = Join-Path $repo "launcher\resources\yume\style.qss"
          $srcSvg = Join-Path $repo "launcher\resources\yume\icons\yume.svg"
          if (!(Test-Path $srcQss)) { throw "style.qss introuvable dans le repo." }
          if (!(Test-Path $srcSvg)) { throw "yume.svg introuvable dans le repo." }

          Copy-Item $srcQss "dist\Yume\yume\style.qss" -Force
          Copy-Item $srcSvg "dist\Yume\yume\icons\yume.svg" -Force
          Write-Host "Thème et icône Yume copiés à côté de l'exe."

      - name: Package zip
        shell: cmd
        run: tar -a -c -f yume-windows.zip -C dist Yume

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yume-windows
          path: yume-windows.zip
