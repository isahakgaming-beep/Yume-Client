name: yume-windows

on:
  push:
    branches: [ develop ]
    paths:
      - '**.cpp'
      - '**.h'
      - 'CMakeLists.txt'
      - 'program_info/**'
      - 'launcher/resources/**'
      - '.github/workflows/yume-windows.yml'
      - 'README.md'
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 1

      - name: Enable MSVC env
        uses: ilammy/msvc-dev-cmd@v1

      - name: Install Ninja
        run: choco install ninja --no-progress -y

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.3'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'
          modules: 'qt5compat qtnetworkauth'
          cache: true

      # Prépare vcpkg (sans manifest) pour utiliser "install --triplet"
      - name: Setup vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgTriplet: x64-windows
          runVcpkgInstall: false

      # >>> Installe zlib en mode classique (IMPORTANT)
      - name: vcpkg install zlib (classic)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          & "$env:VCPKG_ROOT\vcpkg.exe" version
          & "$env:VCPKG_ROOT\vcpkg.exe" install zlib --triplet x64-windows --clean-after-build
          if ($LASTEXITCODE -ne 0) { throw "vcpkg install zlib failed with exit code $LASTEXITCODE" }

      - name: Configure (CMake + Ninja)
        shell: cmd
        run: >
          cmake -S . -B build -G "Ninja"
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=OFF
          -DCMAKE_PREFIX_PATH="%Qt6_DIR%"
          -DCMAKE_TOOLCHAIN_FILE="%VCPKG_ROOT%\scripts\buildsystems\vcpkg.cmake"

      # Build uniquement l'appli (nom de target selon config)
      - name: Build (launcher only)
        shell: cmd
        run: cmake --build build --config Release --target PrismLauncher -j 6 || cmake --build build --config Release --target prismlauncher -j 6

      - name: Bundle with windeployqt
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $candidates = @(
            "build\PrismLauncher.exe",
            "build\prismlauncher.exe",
            "build\launcher\PrismLauncher.exe",
            "build\launcher\prismlauncher.exe"
          )
          $exe = $candidates | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $exe) { throw "Impossible de trouver l'exécutable (PrismLauncher/prismlauncher)." }

          New-Item -ItemType Directory -Path "dist\Yume" -Force | Out-Null
          Copy-Item $exe "dist\Yume\YumeLauncher.exe" -Force

          $qtRoot = Split-Path -Parent (Split-Path -Parent $env:Qt6_DIR)
          $guess = Join-Path $qtRoot "bin\windeployqt.exe"
          if (Test-Path $guess) { $qtBin = $guess }
          else {
            $qtBin = (Get-ChildItem -Path $qtRoot -Recurse -Filter windeployqt.exe -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          }
          if (-not $qtBin) { throw "windeployqt introuvable (Qt6_DIR=$env:Qt6_DIR)" }

          Write-Host "Using windeployqt at: $qtBin"
          & $qtBin "dist\Yume\YumeLauncher.exe" --release --compiler-runtime

      # Copie zlib1.dll depuis vcpkg (chemin standard + fallback récursif)
      - name: Copy vcpkg runtime DLLs (zlib)
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $triplet = "x64-windows"
          $binDir  = Join-Path $env:VCPKG_ROOT "installed\$triplet\bin"
          $target  = "dist\Yume\"
          New-Item -ItemType Directory -Path $target -Force | Out-Null

          $copied = $false
          $candidate = Join-Path $binDir "zlib1.dll"
          if (Test-Path $candidate) {
            Copy-Item $candidate $target -Force
            Write-Host "Copié: $candidate"
            $copied = $true
          } else {
            $found = Get-ChildItem -Path $env:VCPKG_ROOT -Recurse -Filter "zlib1.dll" -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($found) {
              Copy-Item $found.FullName $target -Force
              Write-Host "Copié (fallback): $($found.FullName)"
              $copied = $true
            }
          }

          if (-not $copied) { throw "zlib1.dll introuvable sous %VCPKG_ROOT%. (vcpkg zlib n'a pas produit de DLL ?)" }

      - name: Package zip
        shell: cmd
        run: tar -a -c -f yume-windows.zip -C dist Yume

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: yume-windows
          path: yume-windows.zip
